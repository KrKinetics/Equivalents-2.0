name: Nutrition data tests

on:
  push:
    branches:
      - refactor/nutrition-source-of-truth
      - pilot/nutrition-validation-5-foods
      - pilot/nutrition-validation-6-foods-and-batch-engine
      - batch/fruits-complete-individual-validation
      - batch/vegetables-complete-individual-validation
      - batch/nuts-seeds-complete-individual-validation
      - batch/fats-complete-individual-validation
      - batch/fish-seafood-complete-individual-validation
      - main
      - master
  pull_request:

jobs:
  nutrition-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated schema validators
        run: npm run schema:check

      - name: Sync / validate CNF normalized sources
        run: |
          if [ ! -f src/sources/normalized/cnf-2026-foods.json ]; then
            npm run sources:cnf:sync
          fi
          node --input-type=module -e "
            import fs from 'fs';
            const meta = JSON.parse(fs.readFileSync('src/sources/normalized/cnf-2026-metadata.json','utf8'));
            const foods = JSON.parse(fs.readFileSync('src/sources/normalized/cnf-2026-foods.json','utf8'));
            if (!meta.foodCount || foods.foods.length !== meta.foodCount) {
              console.error('CNF normalized count mismatch');
              process.exit(1);
            }
            console.log('CNF foods:', foods.foods.length);
          "

      - name: Validate approved six-food batch
        run: |
          SANDBOX="$GITHUB_WORKSPACE/ci-batch-validate"
          mkdir -p "$SANDBOX"
          if [ -f reports/batches/pilot-nutrition-validation-6-foods/pre-apply-payload.json ]; then
            cp reports/batches/pilot-nutrition-validation-6-foods/pre-apply-payload.json "$SANDBOX/food-equivalents.json"
          else
            cp src/data/food-equivalents.json "$SANDBOX/food-equivalents.json"
          fi
          FOOD_DATA_PATH="$SANDBOX/food-equivalents.json" \
          npm run nutrition:batch:validate -- src/data/approved-batches/pilot-nutrition-validation-6-foods.json

      - name: Preview approved batch
        run: |
          SANDBOX="$GITHUB_WORKSPACE/ci-batch-validate"
          FOOD_DATA_PATH="$SANDBOX/food-equivalents.json" \
          REPORTS_DIR="$SANDBOX/reports" \
          npm run nutrition:batch:preview -- src/data/approved-batches/pilot-nutrition-validation-6-foods.json

      - name: Dry-run apply in sandbox
        run: |
          SANDBOX="$GITHUB_WORKSPACE/ci-batch-sandbox"
          rm -rf "$SANDBOX"
          mkdir -p "$SANDBOX/reports" "$SANDBOX/backups"
          if [ -f reports/batches/pilot-nutrition-validation-6-foods/pre-apply-payload.json ]; then
            cp reports/batches/pilot-nutrition-validation-6-foods/pre-apply-payload.json "$SANDBOX/food-equivalents.json"
          else
            cp src/data/food-equivalents.json "$SANDBOX/food-equivalents.json"
          fi
          cp src/data/nutrition-data-version.json "$SANDBOX/nutrition-data-version.json"
          cp src/data/nutrition-pilot-config.json "$SANDBOX/nutrition-pilot-config.json"
          FOOD_DATA_PATH="$SANDBOX/food-equivalents.json" \
          VERSION_DATA_PATH="$SANDBOX/nutrition-data-version.json" \
          REPORTS_DIR="$SANDBOX/reports" \
          BACKUPS_DIR="$SANDBOX/backups" \
          NUTRITION_PILOT_CONFIG_PATH="$SANDBOX/nutrition-pilot-config.json" \
          npm run nutrition:batch:apply -- --dry-run src/data/approved-batches/pilot-nutrition-validation-6-foods.json
          # Never mutate production paths from CI apply
          git diff --exit-code -- src/data/food-equivalents.json src/data/nutrition-data-version.json

      - name: Validate fruits batch with scope
        run: |
          SANDBOX="$GITHUB_WORKSPACE/ci-fruits-validate"
          mkdir -p "$SANDBOX/reports"
          if [ -f reports/batches/fruits-complete-individual-validation-32-foods/pre-apply-payload.json ]; then
            cp reports/batches/fruits-complete-individual-validation-32-foods/pre-apply-payload.json "$SANDBOX/food-equivalents.json"
          else
            cp src/data/food-equivalents.json "$SANDBOX/food-equivalents.json"
          fi
          FOOD_DATA_PATH="$SANDBOX/food-equivalents.json" \
          REPORTS_DIR="$SANDBOX/reports" \
          npm run nutrition:batch:validate -- src/data/approved-batches/fruits-complete-individual-validation-32-foods.json
          FOOD_DATA_PATH="$SANDBOX/food-equivalents.json" \
          REPORTS_DIR="$SANDBOX/reports" \
          npm run nutrition:batch:scope -- src/data/approved-batches/fruits-complete-individual-validation-32-foods.json

      - name: Dry-run fruits batch in sandbox
        run: |
          SANDBOX="$GITHUB_WORKSPACE/ci-fruits-sandbox"
          rm -rf "$SANDBOX"
          mkdir -p "$SANDBOX/reports" "$SANDBOX/backups"
          if [ -f reports/batches/fruits-complete-individual-validation-32-foods/pre-apply-payload.json ]; then
            cp reports/batches/fruits-complete-individual-validation-32-foods/pre-apply-payload.json "$SANDBOX/food-equivalents.json"
          else
            cp src/data/food-equivalents.json "$SANDBOX/food-equivalents.json"
          fi
          cp src/data/nutrition-data-version.json "$SANDBOX/nutrition-data-version.json"
          FOOD_DATA_PATH="$SANDBOX/food-equivalents.json" \
          VERSION_DATA_PATH="$SANDBOX/nutrition-data-version.json" \
          REPORTS_DIR="$SANDBOX/reports" \
          BACKUPS_DIR="$SANDBOX/backups" \
          npm run nutrition:batch:apply -- --dry-run src/data/approved-batches/fruits-complete-individual-validation-32-foods.json
          git diff --exit-code -- src/data/food-equivalents.json src/data/nutrition-data-version.json

      - name: Validate vegetables batch with scope
        run: |
          SANDBOX="$GITHUB_WORKSPACE/ci-vegetables-validate"
          mkdir -p "$SANDBOX/reports"
          if [ -f reports/batches/vegetables-complete-individual-validation-36-foods/pre-apply-payload.json ]; then
            cp reports/batches/vegetables-complete-individual-validation-36-foods/pre-apply-payload.json "$SANDBOX/food-equivalents.json"
          else
            cp src/data/food-equivalents.json "$SANDBOX/food-equivalents.json"
          fi
          FOOD_DATA_PATH="$SANDBOX/food-equivalents.json" \
          REPORTS_DIR="$SANDBOX/reports" \
          npm run nutrition:batch:validate -- src/data/approved-batches/vegetables-complete-individual-validation-36-foods.json
          FOOD_DATA_PATH="$SANDBOX/food-equivalents.json" \
          REPORTS_DIR="$SANDBOX/reports" \
          npm run nutrition:batch:scope -- src/data/approved-batches/vegetables-complete-individual-validation-36-foods.json

      - name: Dry-run vegetables batch in sandbox
        run: |
          SANDBOX="$GITHUB_WORKSPACE/ci-vegetables-sandbox"
          rm -rf "$SANDBOX"
          mkdir -p "$SANDBOX/reports" "$SANDBOX/backups"
          if [ -f reports/batches/vegetables-complete-individual-validation-36-foods/pre-apply-payload.json ]; then
            cp reports/batches/vegetables-complete-individual-validation-36-foods/pre-apply-payload.json "$SANDBOX/food-equivalents.json"
          else
            cp src/data/food-equivalents.json "$SANDBOX/food-equivalents.json"
          fi
          cp src/data/nutrition-data-version.json "$SANDBOX/nutrition-data-version.json"
          FOOD_DATA_PATH="$SANDBOX/food-equivalents.json" \
          VERSION_DATA_PATH="$SANDBOX/nutrition-data-version.json" \
          REPORTS_DIR="$SANDBOX/reports" \
          BACKUPS_DIR="$SANDBOX/backups" \
          npm run nutrition:batch:apply -- --dry-run src/data/approved-batches/vegetables-complete-individual-validation-36-foods.json
          git diff --exit-code -- src/data/food-equivalents.json src/data/nutrition-data-version.json

      - name: Validate nuts-seeds batch with scope
        run: |
          SANDBOX="$GITHUB_WORKSPACE/ci-nuts-seeds-validate"
          mkdir -p "$SANDBOX/reports"
          if [ -f reports/batches/nuts-seeds-complete-individual-validation-31-foods/pre-apply-payload.json ]; then
            cp reports/batches/nuts-seeds-complete-individual-validation-31-foods/pre-apply-payload.json "$SANDBOX/food-equivalents.json"
          else
            cp src/data/food-equivalents.json "$SANDBOX/food-equivalents.json"
          fi
          FOOD_DATA_PATH="$SANDBOX/food-equivalents.json" \
          REPORTS_DIR="$SANDBOX/reports" \
          npm run nutrition:batch:validate -- src/data/approved-batches/nuts-seeds-complete-individual-validation-31-foods.json
          FOOD_DATA_PATH="$SANDBOX/food-equivalents.json" \
          REPORTS_DIR="$SANDBOX/reports" \
          npm run nutrition:batch:scope -- src/data/approved-batches/nuts-seeds-complete-individual-validation-31-foods.json

      - name: Dry-run nuts-seeds batch in sandbox
        run: |
          SANDBOX="$GITHUB_WORKSPACE/ci-nuts-seeds-sandbox"
          rm -rf "$SANDBOX"
          mkdir -p "$SANDBOX/reports" "$SANDBOX/backups"
          if [ -f reports/batches/nuts-seeds-complete-individual-validation-31-foods/pre-apply-payload.json ]; then
            cp reports/batches/nuts-seeds-complete-individual-validation-31-foods/pre-apply-payload.json "$SANDBOX/food-equivalents.json"
          else
            cp src/data/food-equivalents.json "$SANDBOX/food-equivalents.json"
          fi
          cp src/data/nutrition-data-version.json "$SANDBOX/nutrition-data-version.json"
          FOOD_DATA_PATH="$SANDBOX/food-equivalents.json" \
          VERSION_DATA_PATH="$SANDBOX/nutrition-data-version.json" \
          REPORTS_DIR="$SANDBOX/reports" \
          BACKUPS_DIR="$SANDBOX/backups" \
          npm run nutrition:batch:apply -- --dry-run src/data/approved-batches/nuts-seeds-complete-individual-validation-31-foods.json
          git diff --exit-code -- src/data/food-equivalents.json src/data/nutrition-data-version.json

      - name: Validate fats batch with scope
        run: |
          SANDBOX="$GITHUB_WORKSPACE/ci-fats-validate"
          mkdir -p "$SANDBOX/reports"
          if [ -f reports/batches/fats-complete-individual-validation-23-foods/pre-apply-payload.json ]; then
            cp reports/batches/fats-complete-individual-validation-23-foods/pre-apply-payload.json "$SANDBOX/food-equivalents.json"
          else
            cp src/data/food-equivalents.json "$SANDBOX/food-equivalents.json"
          fi
          FOOD_DATA_PATH="$SANDBOX/food-equivalents.json" \
          REPORTS_DIR="$SANDBOX/reports" \
          npm run nutrition:batch:validate -- src/data/approved-batches/fats-complete-individual-validation-23-foods.json
          FOOD_DATA_PATH="$SANDBOX/food-equivalents.json" \
          REPORTS_DIR="$SANDBOX/reports" \
          npm run nutrition:batch:scope -- src/data/approved-batches/fats-complete-individual-validation-23-foods.json

      - name: Dry-run fats batch in sandbox
        run: |
          SANDBOX="$GITHUB_WORKSPACE/ci-fats-sandbox"
          rm -rf "$SANDBOX"
          mkdir -p "$SANDBOX/reports" "$SANDBOX/backups"
          if [ -f reports/batches/fats-complete-individual-validation-23-foods/pre-apply-payload.json ]; then
            cp reports/batches/fats-complete-individual-validation-23-foods/pre-apply-payload.json "$SANDBOX/food-equivalents.json"
          else
            cp src/data/food-equivalents.json "$SANDBOX/food-equivalents.json"
          fi
          cp src/data/nutrition-data-version.json "$SANDBOX/nutrition-data-version.json"
          FOOD_DATA_PATH="$SANDBOX/food-equivalents.json" \
          VERSION_DATA_PATH="$SANDBOX/nutrition-data-version.json" \
          REPORTS_DIR="$SANDBOX/reports" \
          BACKUPS_DIR="$SANDBOX/backups" \
          npm run nutrition:batch:apply -- --dry-run src/data/approved-batches/fats-complete-individual-validation-23-foods.json
          git diff --exit-code -- src/data/food-equivalents.json src/data/nutrition-data-version.json

      - name: Validate fish-seafood batch with scope
        run: |
          SANDBOX="$GITHUB_WORKSPACE/ci-fish-seafood-validate"
          mkdir -p "$SANDBOX/reports"
          if [ -f reports/batches/fish-seafood-complete-individual-validation-36-foods/pre-apply-payload.json ]; then
            cp reports/batches/fish-seafood-complete-individual-validation-36-foods/pre-apply-payload.json "$SANDBOX/food-equivalents.json"
          else
            cp src/data/food-equivalents.json "$SANDBOX/food-equivalents.json"
          fi
          FOOD_DATA_PATH="$SANDBOX/food-equivalents.json" \
          REPORTS_DIR="$SANDBOX/reports" \
          npm run nutrition:batch:validate -- src/data/approved-batches/fish-seafood-complete-individual-validation-36-foods.json
          FOOD_DATA_PATH="$SANDBOX/food-equivalents.json" \
          REPORTS_DIR="$SANDBOX/reports" \
          npm run nutrition:batch:scope -- src/data/approved-batches/fish-seafood-complete-individual-validation-36-foods.json

      - name: Dry-run fish-seafood batch in sandbox
        run: |
          SANDBOX="$GITHUB_WORKSPACE/ci-fish-seafood-sandbox"
          rm -rf "$SANDBOX"
          mkdir -p "$SANDBOX/reports" "$SANDBOX/backups"
          if [ -f reports/batches/fish-seafood-complete-individual-validation-36-foods/pre-apply-payload.json ]; then
            cp reports/batches/fish-seafood-complete-individual-validation-36-foods/pre-apply-payload.json "$SANDBOX/food-equivalents.json"
          else
            cp src/data/food-equivalents.json "$SANDBOX/food-equivalents.json"
          fi
          cp src/data/nutrition-data-version.json "$SANDBOX/nutrition-data-version.json"
          FOOD_DATA_PATH="$SANDBOX/food-equivalents.json" \
          VERSION_DATA_PATH="$SANDBOX/nutrition-data-version.json" \
          REPORTS_DIR="$SANDBOX/reports" \
          BACKUPS_DIR="$SANDBOX/backups" \
          npm run nutrition:batch:apply -- --dry-run src/data/approved-batches/fish-seafood-complete-individual-validation-36-foods.json
          git diff --exit-code -- src/data/food-equivalents.json src/data/nutrition-data-version.json

      - name: Check nutrition pilot scope
        run: npm run pilot:check

      - name: Run Node tests
        run: npm run test:nutrition

      - name: Run browser tests
        run: npm run test:browser

      - name: Audit nutrition data in sandbox
        run: |
          SANDBOX="$GITHUB_WORKSPACE/ci-artifacts"
          rm -rf "$SANDBOX"
          mkdir -p "$SANDBOX/reports" "$SANDBOX/backups"
          cp src/data/food-equivalents.json "$SANDBOX/food-equivalents.json"
          cp src/data/nutrition-data-version.json "$SANDBOX/nutrition-data-version.json"
          cp src/data/calculation-groups.json "$SANDBOX/calculation-groups.json"
          FOOD_DATA_PATH="$SANDBOX/food-equivalents.json" \
          VERSION_DATA_PATH="$SANDBOX/nutrition-data-version.json" \
          GROUPS_DATA_PATH="$SANDBOX/calculation-groups.json" \
          REPORTS_DIR="$SANDBOX/reports" \
          BACKUPS_DIR="$SANDBOX/backups" \
          REVIEW_DATA_PATH="$SANDBOX/food-data-review-data.js" \
          npm run data:audit
          node --input-type=module -e "
            import fs from 'fs';
            import { computeFoodsDataHash } from './src/lib/data-hash.mjs';
            const payload = JSON.parse(fs.readFileSync('$SANDBOX/food-equivalents.json', 'utf8'));
            console.log('food count:', payload.foods.length);
            console.log('food dataHash:', computeFoodsDataHash(payload.foods));
          "
          git diff --exit-code -- src/data/food-equivalents.json src/data/nutrition-data-version.json || {
            echo "CI must not modify production nutrition data"
            exit 1
          }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nutrition-audit-reports
          path: |
            ci-artifacts/reports/
            ci-batch-sandbox/reports/
            reports/batches/
            reports/nutrition-pilot-*.json
            reports/nutrition-pilot-*.html
          if-no-files-found: ignore
