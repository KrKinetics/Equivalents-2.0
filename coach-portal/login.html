<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion Coach | KR Kinetics × Elevate</title>
  <link rel="stylesheet" href="./assets/portal.css">
  <script src="/config.js"></script>
</head>
<body>
  <main class="wrap">
    <!-- Keep href in sync with PUBLIC_SITE_URL in assets/public-site.mjs -->
    <a class="public-site-return" href="https://site-web-test-gules.vercel.app/fr">← Retour au site KR Kinetics</a>
    <p class="brand">KR Kinetics × Elevate Fitness</p>
    <h1>Connexion Coach</h1>
    <p class="lead">Accès sur invitation uniquement. Aucune inscription publique.</p>
    <section class="card">
      <div class="auth-modes" role="tablist" aria-label="Mode de connexion">
        <button type="button" class="mode-btn is-active" id="mode-password" data-mode="password" role="tab" aria-selected="true">
          Connexion par mot de passe
        </button>
        <button type="button" class="mode-btn" id="mode-magic" data-mode="magic" role="tab" aria-selected="false">
          Recevoir un lien magique
        </button>
      </div>

      <form id="login-form" data-mode="password">
        <label for="email">Courriel invité</label>
        <input id="email" name="email" type="email" autocomplete="username" required placeholder="vous@exemple.com">

        <div id="password-block">
          <label for="password">Mot de passe</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••">
        </div>

        <button id="submit" type="submit">Se connecter</button>
      </form>
      <div id="status" class="status hidden" role="status"></div>
    </section>
  </main>
  <script type="module" src="./assets/login.js"></script>
</body>
</html>
