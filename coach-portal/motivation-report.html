<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil motivationnel | KR Kinetics</title>
  <link rel="stylesheet" href="./assets/portal.css">
  <link rel="stylesheet" href="./assets/intake-report-document.css">
  <link rel="stylesheet" href="./assets/pre-interview-report-chrome.css">
  <link rel="stylesheet" href="./assets/motivation-report.css">
  <script src="/config.js"></script>
</head>
<body class="intake-report-page motivation-report-page">
  <div class="intake-report-toolbar" data-screen-only="true">
    <a class="btn-compact btn-ghost" href="./dashboard.html" id="back-dashboard">Retour au tableau de bord</a>
    <div class="intake-report-toolbar-actions">
      <button type="button" class="btn-compact btn-primary hidden" id="download-pdf" hidden disabled aria-hidden="true">Exporter PDF</button>
    </div>
  </div>
  <div class="intake-report-page-status">
    <div id="status" class="status hidden" role="status"></div>
  </div>
  <section id="report-error" class="motivation-report-error-card hidden" role="alert">
    <h1>Analyse temporairement indisponible</h1>
    <p>Le questionnaire est bien soumis, mais le rapport n’a pas pu être préparé. Réessayez dans quelques instants.</p>
    <div class="motivation-report-error-actions">
      <button type="button" class="btn-compact btn-primary" id="retry-report">Réessayer</button>
      <a class="btn-compact btn-ghost" href="./dashboard.html">Retour au tableau de bord</a>
    </div>
  </section>
  <div id="report-root"></div>
  <script type="module" src="./assets/motivation-report.js"></script>
</body>
</html>
